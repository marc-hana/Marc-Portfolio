<style>
:root{--bg:#0a0a0a;--card:#141414;--text:#f3efe3;--muted:#a59f8c;--gold:#d4af37;--line:#2a2618;--on-gold:#0a0a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fffdf7;--card:#ffffff;--text:#141414;--muted:#6b6451;--gold:#b8860b;--line:#eadfbd;--on-gold:#ffffff}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6;transition:background .3s,color .3s}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font-family:'Playfair Display',serif;font-weight:700;color:var(--gold);white-space:nowrap}
.links{display:flex;gap:18px;font-size:14px;overflow-x:auto;scrollbar-width:none}
.links a{color:var(--muted);white-space:nowrap}.links a:hover{color:var(--gold)}
#toggle{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
section{padding:70px 0}
.eyebrow{color:var(--gold);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
h2{font-size:clamp(26px,5vw,36px);margin:6px 0 28px}
.hero{padding:80px 0 60px}
.hero h1{font-size:clamp(34px,8vw,62px);line-height:1.1;margin:10px 0 16px}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--muted);max-width:620px;font-size:17px}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{padding:11px 22px;border-radius:6px;font-weight:600;font-size:14px;border:1px solid var(--gold)}
.btn.fill{background:var(--gold);color:var(--on-gold)}
.btn.ghost{color:var(--gold)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card h3{font-size:20px}.card p{margin:0;color:var(--muted);font-size:14.5px}
.tag{align-self:flex-start;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--gold);color:var(--on-gold)}
.tag.wip{background:none;border:1px solid var(--gold);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:20px;font-size:13px}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.more{color:var(--gold);font-weight:600;font-size:14px;margin-top:auto}
.price{font-family:'Playfair Display',serif;font-size:28px;color:var(--gold)}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.card.pop{border-color:var(--gold)}
.facts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fact small{display:block;color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.fact{border-left:2px solid var(--gold);padding-left:12px;word-break:break-word}
footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px;margin-top:14px}
.shot.svc{height:160px;object-position:center}
#aboutText p{color:var(--muted);max-width:720px;margin:0 0 14px}
.seek{margin:22px 0 10px}
.cta{color:var(--muted);font-size:17px;margin:0 0 22px}
.hero .wrap{display:grid;gap:40px;grid-template-columns:1fr 280px;align-items:center}
.photo{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top center;border-radius:14px;border:2px solid var(--gold);box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--line)}
.shot{width:calc(100% + 44px);margin:-22px -22px 6px;height:200px;object-fit:cover;border-radius:10px 10px 0 0;border-bottom:1px solid var(--line)}
@media(max-width:640px){nav .wrap{height:auto;flex-wrap:wrap;padding-top:8px;padding-bottom:6px}.links{order:3;width:100%;gap:18px;padding:2px 0 4px}html{scroll-padding-top:calc(100px + env(safe-area-inset-top,0px))}section{padding:50px 0}.hero .wrap{grid-template-columns:1fr}.photo{max-width:220px;order:-1}}
</style>
</head>

<script>
const C = CONTENT, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

document.title = C.name + " | Portfolio";
$('navLogo').textContent = C.name.split(' ')[0] + " · " + C.brand;
$('role').textContent = C.role;
if(IMG[C.photo]){$('photo').src=IMG[C.photo];$('photo').alt=C.name;}else{$('photo').remove();}
$('headline').innerHTML = esc(C.headline).replace(/(make a difference\.?)/i, '<span>$1</span>');
$('intro').innerHTML = C.intro.map(t => `<p>${esc(t)}</p>`).join('');
$('aboutText').innerHTML = C.aboutText.map(t => `<p>${esc(t)}</p>`).join('');
$('seeking').innerHTML = C.seeking.map(t => `<span class="chip">${esc(t)}</span>`).join('');
$('ctaTitle').textContent = C.cta.title; $('ctaText').textContent = C.cta.text;
$('svcEyebrow').textContent = C.brand + " Services";
$('facts').innerHTML = Object.entries(C.about).map(([k,v]) => `<div class="fact"><small>${esc(k)}</small>${esc(v)}</div>`).join('');
$('projGrid').innerHTML = C.projects.map(p => `
  <div class="card">${p.image&&IMG[p.image]?`<img class="shot" style="object-position:${esc(p.imagePos||'center')}" src="${IMG[p.image]}" alt="${esc(p.title)} screenshot">`:''}<span class="tag ${p.wip?'wip':''}">${esc(p.tag)}</span>
  <h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p><p><b>Stack:</b> ${esc(p.stack)}</p>
  ${p.link ? `<a class="more" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.linkText)} →</a>` : ''}</div>`).join('');
$('chips').innerHTML = C.skills.map(s => `<span class="chip">${esc(s)}</span>`).join('');
$('svcGrid').innerHTML = C.services.map(s => `<div class="card">${s.image&&IMG[s.image]?`<img class="shot svc" src="${IMG[s.image]}" alt="${esc(s.title)}">`:''}<h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p></div>`).join('');
$('rateGrid').innerHTML = C.rates.map(r => `
  <div class="card ${r.popular?'pop':''}">${r.popular?'<span class="tag">Most Popular</span>':''}
  <h3>${esc(r.name)}</h3><div class="price">${esc(r.price)}</div><p>${esc(r.note)}</p>
  <ul>${r.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
  <a class="more" href="#contact">Get a quote →</a></div>`).join('');
const k = C.contact;
$('contactLinks').innerHTML = [
  ['Email', 'mailto:' + k.email, k.email], ['GitHub', k.github], ['LinkedIn', k.linkedin], ['Facebook', k.facebook]
].map(([n,h,t]) => `<a class="chip" href="${esc(h)}" target="_blank" rel="noopener">${esc(t||n)}</a>`).join('');
$('foot').textContent = "© " + new Date().getFullYear() + " " + C.name + " · " + C.brand;

/* Light / dark toggle */
const root = document.documentElement, btn = $('toggle');
function setTheme(t){ root.setAttribute('data-theme', t); btn.textContent = t === 'dark' ? '☀ Light' : '☾ Dark'; try{ localStorage.setItem('theme', t); }catch(e){} }
let saved = null; try{ saved = localStorage.getItem('theme'); }catch(e){}
setTheme(saved || 'dark');
btn.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
