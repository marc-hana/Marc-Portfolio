<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marc Angelo Gutierrez | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06060a;--bg2:#15110a;--text:#f5f0e1;--muted:#a69d86;--gold:#d9b44a;--line:rgba(217,180,74,.28);--card:#0d0d12;--glow:rgba(217,180,74,.2);box-sizing:border-box}
:root[data-theme="light"]{--bg:#fbf7ea;--bg2:#efe3bd;--text:#17130a;--muted:#6e664f;--gold:#a67c00;--line:rgba(166,124,0,.35);--card:#fffdf6;--glow:rgba(217,180,74,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}
body{overflow-x:hidden}
body{background:radial-gradient(ellipse at 50% 38%,var(--bg2) 0,var(--bg) 70%) fixed;transition:background .4s}
a{color:inherit;text-decoration:none}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;display:flex;justify-content:center;align-items:center;gap:clamp(14px,4.5vw,56px);padding:20px 4vw;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
nav a{color:var(--muted);transition:color .2s}nav a:hover,nav a.on{color:var(--gold)}
nav .mono{width:38px;height:38px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:17px;letter-spacing:0;font-weight:600}
#toggle{position:fixed;right:max(16px,3vw);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--card);color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font:600 11px Manrope;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
nav{top:0;padding-top:calc(16px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.idx{position:fixed;left:3vw;top:50%;z-index:30;font-size:11px;letter-spacing:.2em;color:var(--muted);display:none}
.idx b{color:var(--gold);font-weight:600}
@media(min-width:800px){.idx{display:block}}
.scr{position:relative;min-height:100svh;padding:calc(100px + env(safe-area-inset-top,0px)) 7vw 70px;opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s}
.scr.on{opacity:1;transform:none}
.eyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600}
h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,6vw,70px);line-height:1.05;margin:10px 0 26px;letter-spacing:.02em;text-transform:uppercase}
h2 em,.acc{font-style:italic;color:var(--gold);text-transform:none}
/* home */
#home{text-align:center;overflow:hidden}
#stage{width:min(80vmin,560px);height:min(80vmin,560px);position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);filter:drop-shadow(0 30px 60px var(--glow))}
#stage canvas{width:100%;height:100%;display:block}
.ring{position:absolute;inset:12%;border-radius:50%;border:34px solid var(--gold);box-shadow:inset 0 0 40px #000,0 0 50px var(--glow);display:none;transform:rotateX(60deg)}
.nm{position:absolute;left:0;right:0;bottom:calc(8vh + env(safe-area-inset-bottom,0px));padding:0 5vw}
.nm .eyebrow{letter-spacing:.5em}
.nm h1{font-family:'Cormorant Garamond',serif;font-weight:500;margin:8px 0;font-size:clamp(30px,6vw,74px);letter-spacing:.05em;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.nm .sub{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600;text-wrap:balance}
/* about */
.split{display:grid;gap:34px;grid-template-columns:1fr;max-width:1000px;margin:0 auto}
@media(min-width:800px){.split{grid-template-columns:320px 1fr;align-items:center}}
.frame{border:1px solid var(--gold);padding:8px;border-radius:4px}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top}
.split p{color:var(--muted);font-size:16px;margin:0 0 14px;max-width:580px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 22px}
.chip{border:1px solid var(--line);padding:6px 14px;border-radius:30px;font-size:12.5px}.chip.g{border-color:var(--gold);color:var(--gold)}
/* work */
#work{display:flex;flex-direction:column;justify-content:center}
#work .eyebrow,#work h2{text-align:center}
.rail{--pk:6vw;--cw:min(520px,calc(100vw - 26vw));display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;width:calc(var(--cw) + var(--pk)*2);max-width:100%;padding:34px var(--pk) 60px;margin:0 auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.rail::-webkit-scrollbar{display:none}
.cd{flex:0 0 var(--cw);aspect-ratio:16/10;position:relative;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:transform .5s,border-color .4s,box-shadow .5s;overflow:hidden;text-align:left}
.cd::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.85))}
.cd.sel{transform:translateY(12px) scale(1.04);border-color:var(--gold);box-shadow:0 20px 50px var(--glow)}
.cd .ph{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center}
.cd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.cd .ph b{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,9vw,44px);color:var(--gold);font-weight:500;text-align:center;padding:0 10px}
.cd small{position:absolute;left:16px;bottom:30px;z-index:2;color:#f5f0e1;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:700}
.cd i{position:absolute;left:16px;bottom:12px;z-index:2;font-style:normal;font-size:10px;letter-spacing:.2em;color:var(--gold)}
.hint{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
/* detail */
#detail{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;gap:26px;padding:calc(90px + env(safe-area-inset-top,0px)) 7vw 40px;align-content:center;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;overflow-y:auto}
#detail.on{opacity:1;visibility:visible}
@media(min-width:800px){#detail{grid-template-columns:1.1fr 1fr;align-items:center;gap:6vw}}
#detail .frame{background:var(--card)}
#detail .frame img,#detail .frame .big{width:100%;aspect-ratio:16/10;max-height:60vh;object-fit:cover;object-position:top;display:grid;place-items:center}
#detail .big{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,10vw,80px);color:var(--gold);text-align:center}
#detail p{color:var(--muted);max-width:480px}
.btn{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:11px 24px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;border-radius:2px;cursor:pointer;background:none;font-family:Manrope}
.btn:hover{background:var(--gold);color:var(--bg)}
.back{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));left:5vw}
/* services */
.rows{max-width:860px;margin:0 auto}
.row{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;padding:20px 0;border-top:1px solid var(--line)}
.row small{color:var(--gold);padding-top:9px}.row h3{margin:0;font:500 clamp(24px,3.6vw,38px) 'Cormorant Garamond',serif;text-transform:uppercase;letter-spacing:.03em}
.row p{grid-column:2;margin:0;color:var(--muted)}
.rates{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-width:860px;margin:34px auto 0}
.rc{border:1px solid var(--line);padding:22px;border-radius:4px;background:var(--card)}.rc.pop{border-color:var(--gold)}
.rc h3{margin:0;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
.price{font:italic 500 40px 'Cormorant Garamond',serif;color:var(--gold)}
.rc ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
/* contact */
#contact{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.mail{font:500 clamp(20px,4.6vw,52px) 'Cormorant Garamond',serif;border-bottom:1px solid var(--gold);margin:6px 0 26px;word-break:break-all}
#contact .chips{justify-content:center}
@media(max-width:640px){nav{font-size:9px;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 3vw 12px}nav .mono{width:34px;height:34px}}
</style>
</head>

const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
document.title = C.name + " | Portfolio";
$('hLabel').textContent = C.label; $('hName').textContent = C.name; $('hSub').textContent = C.sub;
$('photo').src = IMG.photo || ''; $('photo').alt = C.name;
$('aText').innerHTML = C.about.map(t => `<p>${esc(t)}</p>`).join('');
$('seek').innerHTML = C.seeking.map(t => `<span class="chip g">${esc(t)}</span>`).join('');
$('skills').innerHTML = C.skills.map(t => `<span class="chip">${esc(t)}</span>`).join('');
$('svcEy').textContent = C.brand;
$('rows').innerHTML = C.services.map((s,i) => `<div class="row"><small>0${i+1}</small><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('');
$('rates').innerHTML = C.rates.map(r => `<div class="rc ${r.pop?'pop':''}"><h3>${esc(r.n)}</h3><div class="price">${esc(r.p)}</div><small>${esc(r.note)}</small><ul>${r.i.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
$('cta').textContent = C.cta; $('cta2').textContent = C.cta2;
$('mail').href = 'mailto:' + C.email; $('mail').textContent = C.email;
$('soc').innerHTML = C.socials.map(s => `<a class="chip g" href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])} ↗</a>`).join('');

/* project cards + detail */
const rail = $('rail'), det = $('detail');
rail.innerHTML = C.projects.map((p,i) => `<div class="cd" data-i="${i}"><div class="ph">${p.img && IMG[p.img] ? `<img style="object-position:${esc(p.pos||'top')}" src="${IMG[p.img]}" alt="${esc(p.title)}">` : `<b>${esc(p.title)}</b>`}</div><small>${esc(p.title)}</small><i>0${i+1}</i></div>`).join('');
const cards = [...rail.children];
function sel(i){ cards.forEach((c,k) => c.classList.toggle('sel', k === i)); }
function nearest(){ const m = rail.getBoundingClientRect(), mid = m.left + m.width/2; let b = 0, d = 1e9; cards.forEach((c,k) => { const r = c.getBoundingClientRect(), x = Math.abs(r.left + r.width/2 - mid); if (x < d) { d = x; b = k; } }); sel(b); }
rail.addEventListener('scroll', nearest, {passive:true});
cards.forEach((c,k) => { c.addEventListener('mouseenter', () => sel(k)); c.addEventListener('click', () => { sel(k); openDetail(k); }); });
function openDetail(i){
  const p = C.projects[i], w = p.title.split(' '), last = w.pop();
  det.innerHTML = `<button class="btn back" id="bk">← Back</button>
  <div class="frame">${p.img && IMG[p.img] ? `<img style="object-position:${esc(p.pos||'top')}" src="${IMG[p.img]}" alt="${esc(p.title)}">` : `<div class="big">${esc(p.title)}</div>`}</div>
  <div><div class="eyebrow">${esc(p.tag)}</div><h2>${esc(w.join(' '))} <em>${esc(last)}</em></h2><p>${esc(p.desc)}</p>
  ${p.link ? `<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.cta||'Visit site')} ↗</a>` : '<span class="eyebrow">Coming soon</span>'}</div>`;
  det.classList.add('on'); det.scrollTop = 0; document.documentElement.style.overflow = 'hidden'; $('bk').onclick = closeDetail;
}
function closeDetail(){ det.classList.remove('on'); document.documentElement.style.overflow = ''; }
addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

/* screens (normal scrolling) */
const ids = ['home','about','work','services','contact'], links = [...document.querySelectorAll('nav a')];
window.__scr = 'home';
const rv = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('on'); }), {threshold:.12});
ids.forEach(s => rv.observe($(s)));
const cur = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; const id = e.target.id;
  links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + id && !a.classList.contains('mono')));
  $('idx').innerHTML = `<b>0${ids.indexOf(id)+1}</b> / 0${ids.length}`; window.__scr = id;
}), {rootMargin:'-45% 0px -50% 0px'});
ids.forEach(s => cur.observe($(s)));
sel(Math.min(2, cards.length-1));
let first = true;
new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && first) { first = false; const t = cards[Math.min(2, cards.length-1)];
  rail.scrollLeft += (t.getBoundingClientRect().left + t.offsetWidth/2) - (rail.getBoundingClientRect().left + rail.clientWidth/2); nearest(); } }), {threshold:.3}).observe($('work'));

/* 3D gold ring (donut) */
(function(){
  const st = $('stage');
  try {
    const R = new THREE.WebGLRenderer({antialias:true, alpha:true});
    R.setPixelRatio(Math.min(devicePixelRatio, 2)); st.appendChild(R.domElement);
    const S = new THREE.Scene(), cam = new THREE.PerspectiveCamera(38, 1, .1, 50); cam.position.z = 5;
    const mat = new THREE.ShaderMaterial({
      vertexShader: 'varying vec3 n; varying vec3 v; void main(){ n = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.); v = -mv.xyz; gl_Position = projectionMatrix*mv; }',
      fragmentShader: 'varying vec3 n; varying vec3 v; void main(){ vec3 N = normalize(n), V = normalize(v); float f = pow(1.-max(dot(N,V),0.),2.2); float g = smoothstep(-.7,.9,N.y*.7+N.x*.45+.35); vec3 c = mix(vec3(.05,.035,.01), vec3(.86,.68,.2), g); c += f*vec3(1.,.82,.4)*.9; c += pow(max(dot(N,normalize(vec3(.4,.8,.5))),0.),22.)*1.1; c += pow(max(dot(N,normalize(vec3(-.7,-.3,.5))),0.),14.)*vec3(.7,.35,.1)*.7; gl_FragColor = vec4(c,1.); }'
    });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.05, .46, 72, 180), mat); ring.scale.setScalar(1.1); S.add(ring);
    function size(){ const w = st.clientWidth, h = st.clientHeight; R.setSize(w, h); cam.aspect = w/h; cam.updateProjectionMatrix(); }
    size(); addEventListener('resize', size);
    let mx = 0, my = 0; addEventListener('pointermove', e => { mx = e.clientX/innerWidth - .5; my = e.clientY/innerHeight - .5; });
    const t0 = performance.now();
    (function loop(){ requestAnimationFrame(loop); if (window.__scr !== 'home') return; const t = (performance.now() - t0)/1000;
      ring.rotation.x = 1.0 + Math.sin(t*.4)*.25 + my*.5; ring.rotation.y = t*.35 + mx*.8; ring.rotation.z = .35; R.render(S, cam); })();
  } catch (e) { $('ring').style.display = 'block'; }
})();

/* light / dark toggle */
const root = document.documentElement, btn = $('toggle');
function setTheme(t){ root.setAttribute('data-theme', t); btn.textContent = t === 'dark' ? 'Light' : 'Dark'; try{ localStorage.setItem('theme3', t); }catch(e){} }
let sv = null; try{ sv = localStorage.getItem('theme3'); }catch(e){}
setTheme(sv || 'dark');
btn.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
